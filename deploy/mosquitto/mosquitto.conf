# Mosquitto config for CropMerge FieldScan Live Drone telemetry (DJI Cloud
# API MQTT ingest). Chosen over EMQX: single-broker/single-drone dev rig,
# no clustering/dashboard/multi-tenant ACL requirement.
#
# Re-verify once real Pilot 2 / RC Pro Enterprise hardware is available:
#   - whether DJI's Cloud API bridge expects TLS-only MQTT (port 8883,
#     not enabled here) rather than plaintext 1883
#   - whether it needs a specific client-id/auth scheme this anonymous
#     listener won't satisfy
#
# Dev-only: anonymous access. Do not expose this port beyond a trusted
# local network as configured.

listener 1883
allow_anonymous true
persistence false
log_dest stdout
