[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cropmerge-vision"
version = "0.1.0"
description = "CropMerge Field Triage — Python CV inference engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "Pillow>=10.2",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "PyJWT>=2.10,<3",
  "PyYAML>=6.0",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "paho-mqtt>=2.1",
]

[project.optional-dependencies]
torch = ["torch>=2.2"]
llm-enrichment = ["transformers>=4.46", "accelerate>=1.0"]
dev = ["pytest>=8.0", "pytest-cov>=4.1"]

[project.scripts]
cropmerge-analyze = "scripts.analyze_video:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cropmerge*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
