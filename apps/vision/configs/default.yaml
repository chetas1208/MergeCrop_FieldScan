video:
  sample_fps: 2.0
  max_frames: 24
  supported_extensions: [".mp4", ".mov", ".m4v"]

quality:
  min_sharpness: 0.12
  max_near_black: 0.35
  max_saturated: 0.25
  min_luminance: 20.0
  max_luminance: 235.0
  unusable_weight: 0.15

segmentation:
  # field_cv = real superpixel+cluster analysis (default)
  # sam2 / sam3 when packages+weights available
  # heuristic = simple RGB rules (explicit fallback)
  backend: field_cv
  n_superpixels: 280
  n_clusters: 6
  prompts:
    field: ["crop field", "farmland", "agricultural field"]
    crop: ["crop", "corn", "soybean", "vegetation canopy"]
    bare_soil: ["bare soil", "dirt", "exposed soil"]
    road: ["dirt road", "farm road", "path", "road"]
    trees: ["trees", "tree line", "woodland"]
    water: ["water", "pond", "stream"]
    infrastructure: ["building", "farm building", "farm equipment"]
  min_mask_area_frac: 0.005
  field_union_classes: [CROP, BARE_SOIL, FIELD]

features:
  # auto → DINOv2 if weights+torch else dense_rgb PCA descriptors
  dino_backend: auto
  skip_dino: false
  tile_size: 64
  vegetation_exg_threshold: 0.05

grid:
  rows: 8
  cols: 8
  min_field_fraction: 0.25

anomaly:
  weights:
    dino: 0.35
    coverage: 0.25
    color: 0.20
    vegetation: 0.12
    texture: 0.08
  use_isolation_forest: true
  isolation_forest_weight: 0.18
  high_threshold: 0.62
  medium_threshold: 0.38
  reason_contribution_min: 0.06
  # Blend a spatially-local (neighborhood) baseline into appearance-anomaly
  # z-scores alongside the whole-field one. 0.0 = old pure-global behavior;
  # 1.0 = pure-local. Added 2026-09-02 after a real multi-treatment-zone
  # research plot photo showed the pure-global baseline flagging cells
  # inconsistently across otherwise visually-uniform regions -- median/MAD
  # across the whole field can't represent three large, distinct, roughly-
  # equal treatment zones simultaneously. See cropmerge/anomaly/spatial.py's
  # _local_robust_z() docstring and git history (commit 3d8ae36) for the
  # real before/after evidence.
  local_baseline_weight: 0.5
  local_baseline_radius: 2
  # Real bug fix, 2026-09-02, traced from field feedback ("zero findings
  # apparently impossible"): the relative-ranking component of _to_unit()
  # always inflates the "most different" cell toward a high score, even
  # when the underlying z-scores are all noise-level -- there is always a
  # most-different cell in any grid. Below this raw z-score range across
  # valid cells, the ranking blend is skipped entirely, so a genuinely
  # uniform field can score near-zero everywhere and produce zero findings.
  # See cropmerge/anomaly/spatial.py::_to_unit()'s docstring.
  min_z_range_for_relative_ranking: 1.0
  # Absolute MAD floors per feature (2026-09-02, same "zero findings
  # apparently impossible" fix as above) -- see cropmerge/anomaly/spatial.py
  # ::score_frame()'s comment for why each feature needs its own floor
  # calibrated to its own natural scale. Engineering priors from real
  # observed evidence values, not scientifically validated constants.
  min_mad:
    coverage: 0.01
    color: 0.01
    vegetation: 0.01
    texture: 0.005
    embedding: 0.02

temporal:
  min_persistent_frames: 3
  centroid_link_distance: 0.14
  iou_link_threshold: 0.15
  shadow_suppress: true

structural:
  weights:
    occupancy_deficit: 0.30
    continuity_evidence: 0.25
    gap_extent: 0.20
    fragmentation: 0.15
    soil_exposure: 0.10
  edge_exclusion_px: 12
  row_visibility_min_coherence: 0.12
  # Opt-in Hough-line corroboration for borderline LOW row-visibility scores
  # (see cropmerge/features/row_geometry.py + FarmTech campaign docs). Off by
  # default -- not yet benchmarked against real field footage.
  farmtech_hough_crosscheck_enabled: false
  farmtech_hough_crosscheck_min_rows: 2

boundary:
  min_component_frac: 0.02
  max_hole_fill_frac: 0.008

registration:
  max_corners: 500
  match_ratio: 0.75
  min_inliers: 12
  ransac_reproj_threshold: 3.0

visualization:
  mask_opacity: 0.35
  zone_opacity: 0.45
  heatmap_colormap: turbo
  draw_legend: true

output:
  write_annotated_video: true
  write_heatmap: true
  write_frames: true
  write_metrics: true
  # "continuity" overlays (overlays/continuity_NNNN.jpg) are a second full
  # per-observation rendered JPEG that nothing in the product (frontend
  # FrameReview.vue, the /frames API route, exports) actually reads --
  # audited 2026-09-02 (storage integration campaign Phase 16). Off by
  # default: real storage/CPU waste with zero product value found via grep,
  # not assumption. Flip on only for manual debugging of continuity scoring.
  write_continuity_overlays: false
  jpeg_quality: 85

runtime:
  device: auto
  log_level: INFO
